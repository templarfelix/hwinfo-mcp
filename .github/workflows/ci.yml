name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the portable code (parser, filters, MCP server);
        # windows adds the shared-memory reader, which only compiles there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The tool versions are pinned in .tool-versions, the file asdf reads,
      # so CI builds with exactly what `asdf install` gives a developer.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The release is built for Windows on a Linux runner. Vetting that
      # target and packaging everything on every push keeps a tag from being
      # the first to find out that something no longer builds or packs.
      - name: Vet for Windows
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: go vet ./...

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version-file: .tool-versions

      - name: Package a trial release
        if: runner.os == 'Linux'
        run: go run ./tools/release -version v0.0.0-ci -out dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      # Packing the MCP bundle uses the mcpb tool, which runs on Node.js.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Package
        run: go run ./tools/release -version "$GITHUB_REF_NAME" -out dist

      # A tag such as v1.2.3-rc.1 becomes a pre-release, so it never turns
      # into the "latest" release the README's download links point at.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
